version: '3.9'

services:
  api:
    build: .
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    volumes:
      - sqlite-data:/app/data
      - ./ml/artefacts:/app/ml/artefacts:ro
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: .
    container_name: credit-risk-frontend
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - API_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite-data: