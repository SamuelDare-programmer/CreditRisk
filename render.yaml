databases:
  - name: credit-risk-db
    databaseName: creditrisk
    user: creditrisk_user
    plan: free

services:
  - type: web
    name: credit-risk-api
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVICE_TYPE
        value: api
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: credit-risk-db
          property: connectionString

  - type: web
    name: credit-risk-frontend
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVICE_TYPE
        value: frontend
      - key: API_URL
        fromService:
          type: web
          name: credit-risk-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_KEY
        fromService:
          type: web
          name: credit-risk-api
          envVarKey: SECRET_KEY
